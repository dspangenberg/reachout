name: Publish Flatpak (GitHub Pages)

# Veröffentlicht bei jedem Git-Tag ein eigenes, GPG-signiertes Flatpak-Repo
# auf GitHub Pages (https://dspangenberg.github.io/reachout/). Beachte: der
# Workflow legt den Inhalt von release/repo flach in die Pages-Root ab, d. h.
# das Repo selbst liegt unter der Pages-Root-URL (kein /repo-Suffix).
#
# Voraussetzungen (einmalig einrichten):
#   1. GPG-Signier-Key erzeugen:  ./release/setup-gpg.sh
#   2. Den privaten Key als ARMOR (ASCII) in ein Repo-Secret legen:
#        gpg --export-secret-keys --armor <FPR> | base64 -w0
#      → Secret "FLATPAK_GPG_KEY_ASCII" (base64-kodiert)
#   3. Den Fingerprint des Keys als Secret "FLATPAK_GPG_FINGERPRINT"
#   4. GitHub Pages aktivieren: Settings → Pages → Branch "gh-pages" / (root)
#
# Tags veröffentlichen:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provide GIR files for codegen
        run: |
          set -eu
          # 'gtkx codegen' braucht die GIR-Dateien am Host-Standardpfad
          # (/usr/share/gir-1.0). Im Flathub-Container liegen sie nur in der
          # installierten org.gnome.Sdk-Runtime. Wir KOPIEREN sie daher dorthin
          # (echte Dateien, keine dangling Symlinks).
          DEST="/usr/share/gir-1.0"
          mkdir -p "$DEST"
          # Quelle: beliebiges Verzeichnis, das Gtk-4.0.gir enthält (global suchen)
          PROBE="$(find / -name 'Gtk-4.0.gir' -type f 2>/dev/null | head -n1)"
          if [ -n "$PROBE" ]; then
            SRC="$(dirname "$PROBE")"
            cp -f "$SRC"/*.gir "$DEST/" 2>/dev/null || true
          fi
          # Verifikation: die entscheidende Datei muss echt existieren und lesbar sein
          if [ ! -f "$DEST/Gtk-4.0.gir" ]; then
            echo "error: Gtk-4.0.gir fehlt in $DEST (Probe: '${PROBE:-leer}')" >&2
            exit 1
          fi
          echo "GIR files bereitgestellt: $(find "$DEST" -maxdepth 1 -name '*.gir' | wc -l) .gir unter $DEST"

      - name: Configure GPG signing key
        env:
          GPG_KEY_ASCII: ${{ secrets.FLATPAK_GPG_KEY_ASCII }}
        run: |
          set -e
          mkdir -p /root/.gnupg
          chmod 700 /root/.gnupg
          echo "$GPG_KEY_ASCII" | base64 -d | gpg --batch --import
          gpg --list-secret-keys

      - name: Add flathub remote for SDK resolution
        run: |
          set -eu
          # gtkx baut mit 'flatpak --user install flathub org.gnome.Sdk/...'.
          # Im Container fehlt die 'flathub'-Remote im User-Scope → einmalig anlegen.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Build, sign and stage Flatpak repo
        env:
          SIGNING_KEY_FINGERPRINT: ${{ secrets.FLATPAK_GPG_FINGERPRINT }}
        run: ./release/publish.sh --repo release/repo

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release/repo
          publish_branch: gh-pages
          force_orphan: true
