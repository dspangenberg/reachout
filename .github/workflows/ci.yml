name: CI

# Checkt bei jedem Push/PR: Lint (Biome), Typecheck (tsgo) und Tests (Vitest).
# Läuft im selben GNOME-50-Container wie das Flatpak-Release, damit die
# GIR-Versionen exakt denen des Publish-Workflows entsprechen.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provide GIR files for codegen
        run: |
          set -eu
          # 'gtkx codegen' braucht die GIR-Dateien am Host-Standardpfad
          # (/usr/share/gir-1.0). Im Flathub-Container liegen sie nur in der
          # installierten org.gnome.Sdk-Runtime. Wir KOPIEREN sie daher dorthin
          # (echte Dateien, keine dangling Symlinks).
          DEST="/usr/share/gir-1.0"
          mkdir -p "$DEST"
          PROBE="$(find / -name 'Gtk-4.0.gir' -type f 2>/dev/null | head -n1)"
          if [ -n "$PROBE" ]; then
            SRC="$(dirname "$PROBE")"
            cp -f "$SRC"/*.gir "$DEST/" 2>/dev/null || true
          fi
          if [ ! -f "$DEST/Gtk-4.0.gir" ]; then
            echo "error: Gtk-4.0.gir fehlt in $DEST (Probe: '${PROBE:-leer}')" >&2
            exit 1
          fi
          echo "GIR files bereitgestellt: $(find "$DEST" -maxdepth 1 -name '*.gir' | wc -l) .gir unter $DEST"

      - name: Add flathub remote for SDK resolution
        run: |
          set -eu
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Provide setpriv shim (missing in freedesktop-sdk runtime)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/setpriv" <<'EOF'
          #!/bin/sh
          if [ "$1" = "--pdeathsig" ] && [ "$#" -ge 3 ]; then shift 2; fi
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/setpriv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Expose GNOME runtime libraries
        run: |
          set -eu
          PLAT="/var/lib/flatpak/runtime/org.gnome.Platform/x86_64/50"
          LIB="$(find "$PLAT" -path '*/files/lib/x86_64-linux-gnu' -type d 2>/dev/null | head -n1)"
          if [ -z "$LIB" ]; then
            echo "error: GNOME Platform runtime libraries not found under $PLAT" >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=${LIB}:/app/lib:${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Tests
        run: pnpm test
        env:
          GTKX_COMPOSITOR: weston
          GTKX_I18N_LANG: en_US.utf8
          GTKX_I18N_LC_ALL: en_US.utf8